<body class="min-h-screen text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 flex items-center justify-between px-gutter h-16 w-full">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">insights</span>
<h1 class="font-h2 text-h2 font-bold tracking-tight text-primary">insightO</h1>
</div>
<div class="hidden md:flex gap-md">
<button class="text-on-surface-variant hover:text-primary transition-colors duration-200 font-label-md text-label-md">Support</button>
</div>
</header>
<main class="pt-24 pb-12 px-margin flex flex-col items-center justify-center min-h-[calc(100vh-64px)]">
<div class="w-full max-w-md space-y-xl">
<!-- Hero Heading Section -->
<div class="text-center space-y-sm">
<h2 class="font-display text-display text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your enterprise AI command center.</p>
</div>
<!-- Login Form Card -->
<div class="glass-card p-xl rounded-xl ai-glow">
<form class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block uppercase tracking-widest" for="email">Work Email</label>
<div class="relative group">
<input class="w-full bg-[#020617] border border-outline-variant/30 rounded-lg px-md py-sm text-body-md text-on-surface focus:outline-none focus:border-[#4f46e5] focus:ring-1 focus:ring-[#4f46e5] transition-all placeholder:text-outline-variant" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block uppercase tracking-widest" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="w-full bg-[#020617] border border-outline-variant/30 rounded-lg px-md py-sm text-body-md text-on-surface focus:outline-none focus:border-[#4f46e5] focus:ring-1 focus:ring-[#4f46e5] transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#4f46e5] text-white font-h3 text-h3 py-md rounded-lg primary-glow hover:scale-[1.02] active:scale-95 transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="relative my-xl flex items-center">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink mx-md font-label-sm text-label-sm text-outline-variant">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- SSO Button -->
<button class="w-full flex items-center justify-center gap-md bg-transparent border border-outline-variant/30 text-on-surface py-sm rounded-lg hover:bg-surface-variant/30 transition-all duration-200">
<img alt="Google" class="w-6 h-6" data-alt="A clean, minimalist 3D rendering of the Google logo sphere floating in a dark, tech-oriented digital environment. The scene is illuminated by subtle purple and indigo rim lighting that matches the insightO enterprise aesthetic. The background features a soft bokeh effect with glowing data particles suggesting a high-secure cloud processing environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjIXOeXM9-R7mfgVRGKcfm71pUj_X-fj-wUfQcBHlhx_Nb9saMOM5t1sCbu-7rM2ct5NSUP2sbM4hxnKhgBPk_H9gobCbR34tpLzP3N2B6VP2QT-7oV7xRQj8SnQfiY8Kz33pco6JpUK5Dn0mAlUjIl1K6_3lLw121Uw8diVI9TahRcrqaPPYAc3MzPQlLJUiolP5FEjeJcQokYmvVyR9gjQ55aSce5TJjIG1ujj4RCEAB2WqsgSgzEklooY5EG5zgZY4rDElqVKM"/>
<span class="font-body-md text-body-md">Google Workspace</span>
</button>
</div>
<!-- Footer Links -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Request access</a>
</p>
</div>
</div>

<div class="fixed top-1/4 -right-12 w-64 h-64 bg-primary-container/10 blur-[100px] -z-10 rounded-full"></div>
<div class="fixed bottom-1/4 -left-12 w-48 h-48 bg-tertiary-container/10 blur-[100px] -z-10 rounded-full"></div>

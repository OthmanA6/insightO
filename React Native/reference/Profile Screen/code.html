<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {

                    "primary-container": "#6750a4",
                    "on-error": "#690005",
                    "outline": "#948e9c",

                    "surface-container": "#211f24",
                    "surface-container-lowest": "#0f0d13",

                    "surface-tint": "#cfbcff",
                    "tertiary": "#e7c365",
                    "on-secondary": "#342b4b",
                    "on-surface": "#e6e0e9",
                    "on-background": "#e6e0e9",
                    "on-tertiary": "#3e2e00",
                    "surface-dim": "#141218",
                    "on-secondary-container": "#bfb2da",
                    "error-container": "#93000a",
                    "secondary-fixed-dim": "#cdc0e9",
                    "on-primary-fixed-variant": "#4f378a",

            "spacing": {

                    "margin": "2rem",
                    "md": "1rem",

                    "xs": "0.25rem",

                    "gutter": "1.5rem",
                    "xxl": "4rem"
            },
            "fontSize": {
                    "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "1", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 1);
        }
        .ai-glow {
            box-shadow: 0 0 40px 0 rgba(147, 51, 234, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24 overflow-x-hidden">
<!-- Background Pattern -->
<div class="fixed inset-0 bg-grid-pattern pointer-events-none z-0"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 h-16 flex items-center justify-between px-gutter">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="insights">insights</span>
<h1 class="font-h2 text-h2 font-bold tracking-tight text-primary">insightO</h1>
</div>
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Canvas -->
<main class="relative z-10 pt-20 px-4 max-w-md mx-auto space-y-md">
<!-- Profile Header -->
<section class="flex flex-col items-center py-lg space-y-sm">
<div class="relative">
<div class="w-24 h-24 rounded-full border-2 border-primary p-1 bg-surface-container-high ai-glow">
<img alt="Admin User" class="w-full h-full rounded-full object-cover" data-alt="A professional portrait of a confident woman in corporate attire, set against a blurred high-tech office background with violet and indigo light streaks. The lighting is soft and cinematic, emphasizing a polished and authoritative enterprise aesthetic. The overall mood is intelligent, forward-thinking, and reliable, maintaining a consistent dark-mode color palette of deep slates and purples." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGEq1gWCqwnav2kGiYhhoMuvYXhu00ZjZHTBEneA06ssiHkpj3AXh2s1rJnjsfMskjK8nhdFogcRjLH5MHVCvZSYmMvRIUcRlBS4wuWmQMeoVpmEgJpmCpg5rfqZ1wHCu4FzAf5ZECnSQKLjAl7pNtA8Pxs4RLR4hPKBYydikeVXVZk1HcG2gSlqc7UKD1FYtGiYtTva4Re7SLgGzu_bL4Q88rSt3s0rdRuFe_IeltAZ-Fv3_kralh2lGe1MxMBoDRkNhMyie5DaI"/>
</div>
<div class="absolute bottom-1 right-1 bg-primary text-on-primary p-1 rounded-full border-2 border-background flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<div class="text-center">
<h2 class="font-h1 text-h1 text-on-surface">Admin User</h2>
<p class="font-body-md text-on-surface-variant">Enterprise HR Lead</p>
<div class="mt-2 inline-flex items-center gap-xs px-2 py-1 rounded-lg bg-primary-container/20 border border-primary/30">
<span class="material-symbols-outlined text-primary text-[12px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md text-label-md text-primary">insightO Premium</span>
</div>
</div>
</section>
<!-- AI Performance Tags -->
<section class="glass-card rounded-xl p-md">
<div class="flex items-center justify-between mb-sm">
<h3 class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">AI Insights</h3>
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="auto_awesome">auto_awesome</span>
</div>
<div class="flex flex-wrap gap-sm">
<span class="px-3 py-1 rounded-full border border-primary/20 bg-primary-container/10 text-primary font-label-md">Productivity</span>
<span class="px-3 py-1 rounded-full border border-tertiary/20 bg-tertiary-container/10 text-tertiary font-label-md">Leadership</span>
<span class="px-3 py-1 rounded-full border border-outline-variant/30 bg-surface-variant/30 text-on-surface-variant font-label-md">Strategic Thinking</span>
</div>
</section>
<!-- Menu Sections -->
<div class="space-y-sm">
<!-- Organization Settings -->
<div class="glass-card rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-md hover:bg-surface-variant/30 transition-all active:scale-[0.98]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="domain">domain</span>
<div class="text-left">
<p class="font-h3 text-body-md">Organization Settings</p>
<p class="font-body-sm text-on-surface-variant text-[12px]">Structure, teams &amp; hierarchy</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- AI Evaluation Parameters -->
<div class="glass-card rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-md hover:bg-surface-variant/30 transition-all active:scale-[0.98]">
<div class="flex items-center gap-md">
<div class="relative">
<span class="material-symbols-outlined text-primary" data-icon="psychology">psychology</span>
<div class="absolute -top-1 -right-1 w-2 h-2 bg-tertiary rounded-full animate-pulse"></div>
</div>
<div class="text-left">
<p class="font-h3 text-body-md">AI Evaluation Parameters</p>
<p class="font-body-sm text-on-surface-variant text-[12px]">Configure LLM scoring models</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Security -->
<div class="glass-card rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-md hover:bg-surface-variant/30 transition-all active:scale-[0.98]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="shield">shield</span>
<div class="text-left">
<p class="font-h3 text-body-md">Security</p>
<p class="font-body-sm text-on-surface-variant text-[12px]">2FA, Privacy &amp; Audit logs</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Support -->
<div class="glass-card rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-md hover:bg-surface-variant/30 transition-all active:scale-[0.98]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="help_outline">help_outline</span>
<div class="text-left">
<p class="font-h3 text-body-md text-on-surface-variant">Support</p>
<p class="font-body-sm text-on-surface-variant/60 text-[12px]">Knowledge base &amp; Help desk</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="open_in_new">open_in_new</span>
</button>
</div>
</div>
<!-- Logout Action -->
<button class="w-full py-md text-error font-body-md flex items-center justify-center gap-sm mt-lg transition-transform active:scale-95">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span>Sign Out</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container/90 dark:bg-surface-container/90 backdrop-blur-xl border-t border-outline-variant/20 shadow-[0_-4px_24px_rgba(79,70,229,0.1)] h-20 px-2 flex justify-around items-center"><!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<!-- Forms -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-label-md text-label-md">Forms</span>
</button>
<!-- Admin Center -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="admin_panel_settings">admin_panel_settings</span>
<span class="font-label-md text-label-md">Admin</span>
</button>
<!-- Profile (Active) -->
<button class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-1 active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button></nav>
</body></html>
